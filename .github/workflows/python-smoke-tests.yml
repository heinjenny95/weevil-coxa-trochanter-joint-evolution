name: Python smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  robust-helix-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/analysis/screw_geometry_analysis/requirements-python.txt

      - name: Install test dependencies
        run: python -m pip install -r scripts/analysis/screw_geometry_analysis/requirements-python.txt

      - name: Run robust helix recovery and parser tests
        working-directory: scripts/analysis/screw_geometry_analysis
        run: python -m unittest -v test_fit_helical_paths.py
